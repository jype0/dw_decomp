name: fish
sha1: a26f3b509124ffa11a0b754eec474db13b0c690b
options:
  basename: fish
  target_path: disks/jp/FISH_REL.BIN
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/jp/fish
  src_path: src/fish
  asset_path: build/jp/psx/generated/assets/fish
  build_path: build

  ld_script_path: build/jp/psx/generated/fish.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  gp_value: 0x80144E0C

  generate_asm_macros_files: False

  section_order: [".text", ".rodata", ".data", ".sdata", ".sbss", ".bss"]

  symbol_addrs_path:
    - config/jp/symbols.txt
    - config/jp/symbols_fish.txt

  undefined_funcs_auto_path: build/jp/psx/generated/undefined_funcs_auto_fish.txt
  undefined_syms_auto_path: build/jp/psx/generated/undefined_syms_auto_fish.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  migrate_rodata_to_functions: False

  create_data_pads: False

  use_gp_rel_macro: True

  asm_data_macro: dlabel_section
  asm_data_end_label: enddlabel_section

  symbol_name_format: $VRAM_fish
  symbol_name_format_no_rom: $VRAM_fish

segments:
  - name: header
    type: rodata
    start: 0x0
    vram: 0x80070000
    align: 4
    subalign: 4

  - name: fish
    type: code
    start: 0x40
    vram: 0x80070040
    align: 4
    subalign: 4
    subsegments:
      - [0x40, c, fish]
      - [0xDD2C, c, fish_model]
      - [0xE034, .rodata, fish]
      - [0xE0C8, .data, fish]
      - [0xEA68, .data, fish_bss_jp]

  - [0x11890]
