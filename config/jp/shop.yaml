name: shop
sha1: 12abe8e6590b49a4a32a96e4b47441a3fa7a7073
options:
  basename: shop
  target_path: disks/jp/SHOP_REL.BIN
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/jp
  data_path: shop/data
  nonmatchings_path: shop/nonmatchings
  matchings_path: shop/matchings
  src_path: src
  asset_path: build/jp/psx/generated/assets/shop
  build_path: build

  ld_script_path: build/jp/psx/generated/shop.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  gp_value: 0x80144E0C

  generate_asm_macros_files: False

  section_order: [".text", ".rodata", ".data", ".sdata", ".sbss", ".bss"]

  symbol_addrs_path:
    - config/jp/symbols.txt
    - config/jp/symbols_shop.txt

  undefined_funcs_auto_path: build/jp/psx/generated/undefined_funcs_auto_shop.txt
  undefined_syms_auto_path: build/jp/psx/generated/undefined_syms_auto_shop.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  migrate_rodata_to_functions: False

  create_data_pads: False

  use_gp_rel_macro: True

  symbol_name_format: $VRAM_shop
  symbol_name_format_no_rom: $VRAM_shop

segments:
  - name: header
    type: rodata
    start: 0x0
    vram: 0x80080800
    align: 4
    subalign: 4

  - name: shop
    type: code
    start: 0x40
    vram: 0x80080840
    align: 4
    subalign: 4
    subsegments:
      - [0x40, c, main/script_menu]
      - [0x7860, .rodata, main/script_menu]
      - [0x79F8, .data, main/script_menu]

  - [0x7E0C]
