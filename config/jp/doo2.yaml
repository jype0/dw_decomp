name: doo2
sha1: 863c0d2d4e019dd6a3b511e023f4ac71c328ec63
options:
  basename: doo2
  target_path: disks/jp/DOO2_REL.BIN
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/jp/doo2
  src_path: src/doo2
  asset_path: build/jp/psx/generated/assets/doo2
  build_path: build

  ld_script_path: build/jp/psx/generated/doo2.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  gp_value: 0x80144E0C

  generate_asm_macros_files: False

  section_order: [".text", ".rodata", ".data", ".sdata", ".sbss", ".bss"]

  symbol_addrs_path:
    - config/jp/symbols.txt
    - config/jp/symbols_doo2.txt

  undefined_funcs_auto_path: build/jp/psx/generated/undefined_funcs_auto_doo2.txt
  undefined_syms_auto_path: build/jp/psx/generated/undefined_syms_auto_doo2.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  migrate_rodata_to_functions: False

  create_data_pads: False

  use_gp_rel_macro: True

  asm_data_macro: dlabel_section
  asm_data_end_label: enddlabel_section

  symbol_name_format: $VRAM_doo2
  symbol_name_format_no_rom: $VRAM_doo2

segments:
  - name: header
    type: rodata
    start: 0x0
    vram: 0x80070000
    align: 4
    subalign: 4

  - name: doo2
    type: code
    start: 0x40
    vram: 0x80070040
    align: 4
    subalign: 4
    subsegments:
      - [0x40, c, doo2]
      - [0x2738, .data, doo2]
      - [0x279C, .data, doo2_bss_jp]

  - [0xC3A4]
