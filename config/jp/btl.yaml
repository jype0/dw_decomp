name: btl
sha1: 7585908ac200c07c6eb9d6a08a301b02ac5d27e5
options:
  basename: btl
  target_path: disks/jp/BTL_REL.BIN
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/jp/btl
  src_path: src/btl
  asset_path: build/jp/psx/generated/assets/btl
  build_path: build

  ld_script_path: build/jp/psx/generated/btl.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  gp_value: 0x80144E0C

  generate_asm_macros_files: False

  section_order: [".text", ".rodata", ".data", ".sdata", ".sbss", ".bss"]

  symbol_addrs_path:
    - config/jp/symbols.txt
    - config/jp/symbols_btl.txt

  undefined_funcs_auto_path: build/jp/psx/generated/undefined_funcs_auto_btl.txt
  undefined_syms_auto_path: build/jp/psx/generated/undefined_syms_auto_btl.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  migrate_rodata_to_functions: False

  create_data_pads: False

  use_gp_rel_macro: True

  symbol_name_format: $VRAM_btl
  symbol_name_format_no_rom: $VRAM_btl

segments:
  - name: texture
    type: rodata
    start: 0x0
    vram: 0x80052AE0
    align: 4
    subalign: 4

  - name: model_0
    type: rodata
    start: 0xD20
    vram: 0x80053800
    align: 4
    subalign: 4

  - name: model_1
    type: rodata
    start: 0x1D58
    vram: 0x80054838
    align: 4
    subalign: 4

  - name: model_2
    type: rodata
    start: 0x2220
    vram: 0x80054D00
    align: 4
    subalign: 4

  - name: model_3
    type: rodata
    start: 0x2848
    vram: 0x80055328
    align: 4
    subalign: 4

  - name: header
    type: rodata
    start: 0x4188
    vram: 0x80056C68
    align: 4
    subalign: 4

  - name: btl
    type: code
    start: 0x41C8
    vram: 0x80056CA8
    align: 4
    subalign: 4
    subsegments:
      - [0x41C8, c, battle_setup]
      - [0x5498, c, battle_main]
      - [0x1102C, c, command_shout]
      - [0x115D4, c, command_menu]
      - [0x131E4, c, battle_hud]
      - [0x15DD0, c, battle_effect]
      - [0x28A4C, .rodata, battle_main]
      - [0x28A60, .rodata, battle_setup]
      - [0x28A7C, .rodata, command_menu]
      - [0x28A98, .data, command_shout]
      - [0x28B6C, .data, command_menu]
      - [0x28C10, .data, battle_effect]
      - [0x29BAC, .data, btl_bss_jp]

  - [0x2BCD0]
