name: vs
sha1: 03f783647bd0342a6bd833bc0c3632d77894b1f5
options:
  basename: vs
  target_path: disks/jp_rev1/VS_REL.BIN
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/jp_rev1/vs
  src_path: src/vs
  asset_path: build/jp_rev1/psx/generated/assets/vs
  build_path: build

  ld_script_path: build/jp_rev1/psx/generated/vs.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  gp_value: 0x8014582C

  generate_asm_macros_files: False

  section_order: [".text", ".rodata", ".data", ".sdata", ".sbss", ".bss"]

  symbol_addrs_path:
    - config/jp_rev1/symbols.txt
    - config/jp_rev1/symbols_vs.txt
  reloc_addrs_path:
    - config/jp_rev1/relocs_vs.txt

  undefined_funcs_auto_path: build/jp_rev1/psx/generated/undefined_funcs_auto_vs.txt
  undefined_syms_auto_path: build/jp_rev1/psx/generated/undefined_syms_auto_vs.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  migrate_rodata_to_functions: False

  create_data_pads: False

  use_gp_rel_macro: True

  symbol_name_format: $VRAM_vs
  symbol_name_format_no_rom: $VRAM_vs

