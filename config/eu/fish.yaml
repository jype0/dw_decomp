name: fish
sha1: 61b075c3dbf544b0bd3058543461a8119335f22e
options:
  basename: fish
  target_path: disks/eu/FISH_REL.BIN
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/eu/fish
  src_path: src/fish
  asset_path: build/eu/psx/generated/assets/fish
  build_path: build

  ld_script_path: build/eu/psx/generated/fish.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  gp_value: 0x80142BF4

  generate_asm_macros_files: False

  section_order: [".text", ".rodata", ".data", ".sdata", ".sbss", ".bss"]

  symbol_addrs_path:
    - config/eu/symbols.txt
    - config/eu/symbols_fish.txt

  undefined_funcs_auto_path: build/eu/psx/generated/undefined_funcs_auto_fish.txt
  undefined_syms_auto_path: build/eu/psx/generated/undefined_syms_auto_fish.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  migrate_rodata_to_functions: False

  create_data_pads: False

  use_gp_rel_macro: True

  asm_data_macro: dlabel_section
  asm_data_end_label: enddlabel_section

  symbol_name_format: $VRAM_fish
  symbol_name_format_no_rom: $VRAM_fish

segments:
  - name: header
    type: rodata
    start: 0x0
    vram: 0x80070000
    align: 4
    subalign: 4

  - name: fish
    type: code
    start: 0x40
    vram: 0x80070040
    align: 4
    subalign: 4
    subsegments:
      - [0x40, c, fish]
      - [0xDD98, c, fish_model]
      - [0xE0A0, .rodata, fish]
      - [0xE134, .data, fish]
      - [0xEB88, .data, fish_bss_eu]

  - [0x119D0]
