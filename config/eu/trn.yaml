name: trn
sha1: 45fa5a21ca417464952d50e727f1b655bade4ee8
options:
  basename: trn
  target_path: disks/eu/TRN_REL.BIN
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/eu/trn
  src_path: src/trn
  asset_path: build/eu/psx/generated/assets/trn
  build_path: build

  ld_script_path: build/eu/psx/generated/trn.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  gp_value: 0x80142BF4

  generate_asm_macros_files: False

  section_order: [".text", ".rodata", ".data", ".sdata", ".sbss", ".bss"]

  symbol_addrs_path:
    - config/eu/symbols.txt
    - config/eu/symbols_trn.txt

  undefined_funcs_auto_path: build/eu/psx/generated/undefined_funcs_auto_trn.txt
  undefined_syms_auto_path: build/eu/psx/generated/undefined_syms_auto_trn.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  migrate_rodata_to_functions: False

  create_data_pads: False

  use_gp_rel_macro: True

  asm_data_macro: dlabel_section
  asm_data_end_label: enddlabel_section

  symbol_name_format: $VRAM_trn
  symbol_name_format_no_rom: $VRAM_trn

segments:
  - name: header
    type: rodata
    start: 0x0
    vram: 0x80088800
    align: 4
    subalign: 4

  - name: trn
    type: code
    start: 0x40
    vram: 0x80088840
    align: 4
    subalign: 4
    subsegments:
      - [0x40, c, trn_reward]
      - [0x2868, c, trn_hp]
      - [0x2F04, c, trn_mp]
      - [0x34F8, c, trn_off]
      - [0x409C, c, trn_def]
      - [0x4BB8, c, trn_speed]
      - [0x50EC, c, trn_brain]
      - [0x5814, c, trn_hud]
      - [0x6704, c, trn_slots]
      - [0x78D4, .rodata, trn_hp]
      - [0x78EC, .rodata, trn_off]
      - [0x7910, .rodata, trn_speed]
      - [0x7928, .rodata, trn_def]
      - [0x7964, .rodata, trn_mp]
      - [0x7980, .rodata, trn_brain]
      - [0x7998, .rodata, trn_reward]
      - [0x79B0, .rodata, trn_slots]
      - [0x79CC, .data, trn_reward]
      - [0x7B74, .data, trn_hud]
      - [0x7CA0, .data, trn_slots]
      - [0x7CF4, .data, trn_bss_eu]

  - [0x7DA8]
