name: trn2
sha1: e73f0355b8237d9b0e776fd8a2e1b87428c2f421
options:
  basename: trn2
  target_path: disks/jp_bombom/TRN2_REL.BIN
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/jp_bombom/trn2
  src_path: src/trn2
  asset_path: build/jp_bombom/psx/generated/assets/trn2
  build_path: build

  ld_script_path: build/jp_bombom/psx/generated/trn2.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  gp_value: 0x8014685C

  generate_asm_macros_files: False

  section_order: [".text", ".rodata", ".data", ".sdata", ".sbss", ".bss"]

  symbol_addrs_path:
    - config/jp_bombom/symbols.txt
    - config/jp_bombom/symbols_trn2.txt

  undefined_funcs_auto_path: build/jp_bombom/psx/generated/undefined_funcs_auto_trn2.txt
  undefined_syms_auto_path: build/jp_bombom/psx/generated/undefined_syms_auto_trn2.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  migrate_rodata_to_functions: False

  create_data_pads: False

  use_gp_rel_macro: True

  symbol_name_format: $VRAM_trn2
  symbol_name_format_no_rom: $VRAM_trn2

segments:
  - name: header
    type: rodata
    start: 0x0
    vram: 0x80088800
    align: 4
    subalign: 4

  - name: trn2
    type: code
    start: 0x40
    vram: 0x80088840
    align: 4
    subalign: 4
    subsegments:
      - [0x40, c, trn2_hp_map99]
      - [0x560, c, trn2_def_map99]
      - [0xA9C, c, trn2_hp_map107]
      - [0x10E8, c, trn2_mp]
      - [0x1538, c, trn2_off]
      - [0x1BB8, c, trn2_def_map108]
      - [0x2338, c, trn2_reward]
      - [0x35C8, c, trn2_hud]
      - [0x4D88, c, trn2_slots]
      - [0x5F58, .rodata, trn2_hp_map107]
      - [0x5F70, .rodata, trn2_hp_map99]
      - [0x5F88, .rodata, trn2_mp]
      - [0x5FA4, .rodata, trn2_off]
      - [0x5FC0, .rodata, trn2_reward]
      - [0x5FDC, .rodata, trn2_def_map108]
