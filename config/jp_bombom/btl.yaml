      - [0x28B14, .rodata, battle_main]
      - [0x28B28, .rodata, battle_setup]
      - [0x28B44, .rodata, command_menu]
      - [0x28B60, .data, command_shout]
      - [0x28C34, .data, command_menu]
      - [0x28CD8, .data, battle_effect]
      - [0x29C74, .data, btl_bss_jp_bombom]

  - [0x2BD98]
